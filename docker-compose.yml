# Local monitoring stack: service + Prometheus + Alertmanager + Grafana.
# Host ports are overridable, e.g. HOSTOPS_PORT=8001 docker compose up -d --build
# Ports bind to 127.0.0.1 only: the API has no auth yet and Grafana uses local admin/admin.
services:
  hostops:
    build: .
    image: hostops-agent:local
    environment:
      HOSTOPS_PROVIDER: ${HOSTOPS_PROVIDER:-offline}
      HOSTOPS_SYNC_INTERVAL_S: "15"
      # Only read when HOSTOPS_PROVIDER=anthropic; comes from your shell, never from this file.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${HOSTOPS_PORT:-8000}:8000"
    volumes:
      - hostops-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on: [hostops, alertmanager]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./ops/alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      # Local-only default from CLAUDE.md (admin / admin). Not used anywhere outside this compose file.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hostops.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  hostops-data:
