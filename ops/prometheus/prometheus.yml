global:
  scrape_interval: 5s       # short for demos; 15-30s is normal in production
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: hostops
    metrics_path: /metrics
    static_configs:
      - targets: ["hostops:8000"]
