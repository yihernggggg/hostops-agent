route:
  receiver: hostops
  group_by: [alertname]
  group_wait: 10s        # batch the first notification briefly
  group_interval: 1m
  repeat_interval: 5m    # merged into the open incident; also re-creates it if the service restarted

receivers:
  - name: hostops
    webhook_configs:
      - url: http://hostops:8000/alerts
        send_resolved: true   # resolved alerts close the incident
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/api_token
