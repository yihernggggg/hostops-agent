# Deploy main to the EC2 instance (infra/hostops.yml).
# Push to main: build the image once, tag it with the commit SHA, push to ECR, deploy through SSM, smoke-test.
# Rollback: run this workflow manually (from main) with the SHA of an earlier commit.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy (rollback). Leave empty to deploy the current main.
        required: false
        default: ""

# OIDC token for AWS, read-only access to the repo. No AWS keys are stored in GitHub.
# Actions are pinned to commit SHAs (this job holds AWS credentials); Dependabot proposes updates.
permissions:
  contents: read
  id-token: write

# One deploy at a time, and never cancel one halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      TOKEN_PARAMETER: /hostops/api-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0  # full history of main, for the ancestry check below

      - name: Resolve the commit and prove it is on main
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          SHA="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit hash"; exit 1; }
          # Fork and unmerged-PR commits can be fetched by SHA through this repo, so a well-formed SHA is not
          # enough: only commits reachable from main (reviewed and CI-gated) may be deployed.
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$SHA is not on main; only merged commits can be deployed"; exit 1; }
          git checkout --quiet --detach "$SHA"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGE=$ECR_REPOSITORY_URI:$SHA" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and push the image (once per commit)
        run: |
          repo="${ECR_REPOSITORY_URI#*/}"
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "Image for $SHA already in ECR; reusing it."
          else
            aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_REPOSITORY_URI%%/*}"
            docker build -t "$IMAGE" .
            docker push "$IMAGE"
          fi

      - name: Deploy on the instance through SSM
        run: |
          script="set -euo pipefail
          src=\$(mktemp -d)
          curl -fsSL https://codeload.github.com/$GITHUB_REPOSITORY/tar.gz/$SHA | tar -xz -C \$src --strip-components=1
          bash \$src/scripts/deploy_on_instance.sh $SHA $IMAGE $AWS_REGION $TOKEN_PARAMETER $GITHUB_REPOSITORY
          rm -rf \$src"
          params=$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["900"]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy $SHA" --parameters "$params" --query Command.CommandId --output text)
          echo "SSM command $id"
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Deploy command status: $status"
          [[ "$status" == "Success" ]]

      - name: Smoke test /healthz
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "smoke test $SHA" \
            --parameters '{"commands":["curl -fsS --max-time 5 http://127.0.0.1:8000/healthz"]}' \
            --query Command.CommandId --output text)
          for _ in $(seq 1 24); do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          body=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text)
          echo "healthz: $body"
          [[ "$status" == "Success" ]] && grep -q '"status":"ok"' <<<"$body"
          echo "Deployed $SHA" >> "$GITHUB_STEP_SUMMARY"
