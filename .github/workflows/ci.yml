# CI: the definition of done from CLAUDE.md, plus a Docker build.
# Job names are stable on purpose: Phase 4 makes them required status checks on main.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the workflow token: CI only reads the repo.
permissions:
  contents: read

# A new push to the same PR cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,llm]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy hostops
      - name: Pytest
        run: pytest -q

  evals:
    name: offline eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Run evals (fails below threshold)
        run: python -m evals.run --provider offline
      - name: Add report to job summary
        if: always()
        run: cat evals/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: evals/report.md
          if-no-files-found: error

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t hostops-agent:${{ github.sha }} .
